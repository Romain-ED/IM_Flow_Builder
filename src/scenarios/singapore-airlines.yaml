# Business Messaging Flow Simulator — example scenario
#
# Fictional airline check-in journey. All passenger, flight and booking
# details below are invented for demonstration purposes only and do not
# represent real flight operations.
version: "1.0"

metadata:
  id: singapore-airlines-boarding-pass
  name: "Singapore Airlines — Check-in & Boarding Pass"
  description: >-
    Interactive airline check-in journey demonstrating RCS/WhatsApp rich
    messaging, seat selection and boarding-pass delivery.
  channel: rcs
  tags: [airline, travel, check-in, boarding-pass, demo]

brand:
  name: "Singapore Airlines (Demo)"
  shortName: "SIA Demo"
  avatar: "/assets/brand-avatar.svg"
  logo: "/assets/brand-logo.svg"
  verified: true
  website: "https://www.singaporeair.com"
  supportPhone: "+65 6223 8888"

defaults:
  messageDelayMs: 600
  typingDurationMs: 900
  locale: en-SG
  timezone: Asia/Singapore
  showTimestamps: true

variables:
  customerName: Romain
  lastName: Martin
  bookingReference: ABC123
  flightNumber: SQ634
  aircraft: Airbus A350-900

  originCode: SIN
  originCity: Singapore
  originAirport: Singapore Changi Airport

  destinationCode: HND
  destinationCity: Tokyo
  destinationAirport: Tokyo Haneda Airport

  departureDate: 13 August 2026
  departureTime: "09:20"
  arrivalTime: "17:05"
  terminal: "3"
  gate: B7

  boardingTime: "08:35"
  seat: null
  cabin: Economy

  krisFlyerStatus: Gold
  krisFlyerNumber: KF12345678

  checkedIn: false

start: welcome

nodes:
  # --------------------------------------------------
  # WELCOME
  # --------------------------------------------------
  - id: welcome
    messages:
      - type: text
        sender: business
        text: |
          Good morning {{customerName}} 👋

          Your flight {{flightNumber}} to {{destinationCity}} departs in 2 days.

          Online check-in is now available.
      - type: suggested_replies
        sender: business
        options:
          - label: Check in
            value: check_in
            next: check_in_intro
          - label: View booking
            value: view_booking
            next: booking_details
          - label: Not now
            value: not_now
            next: not_now

  # --------------------------------------------------
  # NOT NOW
  # --------------------------------------------------
  - id: not_now
    messages:
      - type: text
        sender: business
        text: |
          No problem.

          You can check in anytime before online check-in closes.
      - type: suggested_replies
        sender: business
        options:
          - label: Check in now
            next: check_in_intro
          - label: Flight details
            next: booking_details

  # --------------------------------------------------
  # BOOKING DETAILS
  # --------------------------------------------------
  - id: booking_details
    messages:
      - type: flight_card
        sender: business
        airline: Singapore Airlines
        flightNumber: "{{flightNumber}}"
        origin: { code: "{{originCode}}", city: "{{originCity}}" }
        destination: { code: "{{destinationCode}}", city: "{{destinationCity}}" }
        date: "{{departureDate}}"
        departureTime: "{{departureTime}}"
        arrivalTime: "{{arrivalTime}}"
        terminal: "{{terminal}}"
        gate: "{{gate}}"
        bookingReference: "{{bookingReference}}"
        status: Check-in available
      - type: suggested_replies
        sender: business
        options:
          - label: Check in
            next: check_in_intro
          - label: Choose seat
            next: seat_selection
          - label: Back
            next: welcome

  # --------------------------------------------------
  # CHECK-IN INTRO
  # --------------------------------------------------
  - id: check_in_intro
    messages:
      - type: typing
        duration: 700
      - type: text
        sender: business
        text: |
          Let's get you checked in for {{flightNumber}}.
      - type: flight_card
        sender: business
        airline: Singapore Airlines
        flightNumber: "{{flightNumber}}"
        origin: { code: "{{originCode}}", city: "{{originCity}}" }
        destination: { code: "{{destinationCode}}", city: "{{destinationCity}}" }
        date: "{{departureDate}}"
        departureTime: "{{departureTime}}"
        arrivalTime: "{{arrivalTime}}"
        terminal: "{{terminal}}"
      - type: text
        sender: business
        text: |
          Passenger

          {{customerName}} {{lastName}}

          KrisFlyer {{krisFlyerStatus}}
      - type: suggested_replies
        sender: business
        options:
          - label: Continue
            next: check_in_options
          - label: Cancel
            next: welcome

  # --------------------------------------------------
  # CHECK-IN OPTIONS
  # --------------------------------------------------
  - id: check_in_options
    messages:
      - type: text
        sender: business
        text: |
          Before completing check-in, would you like to select your seat?
      - type: suggested_replies
        sender: business
        options:
          - label: Choose seat
            next: seat_selection
          - label: Keep assigned seat
            set: { seat: 24C }
            next: check_in_processing

  # --------------------------------------------------
  # SEAT SELECTION
  # --------------------------------------------------
  - id: seat_selection
    messages:
      - type: text
        sender: business
        text: |
          Here are some available seats for {{flightNumber}}.
      - type: carousel
        sender: business
        cards:
          - id: seat-21a
            title: 21A
            subtitle: Window seat
            description: |
              Economy Class

              Window
              Standard seat
            badges: [Available, Window]
            actions:
              - type: reply
                label: Select 21A
                set: { seat: 21A }
                next: seat_selected
          - id: seat-21c
            title: 21C
            subtitle: Aisle seat
            description: |
              Economy Class

              Aisle
              Standard seat
            badges: [Available, Aisle]
            actions:
              - type: reply
                label: Select 21C
                set: { seat: 21C }
                next: seat_selected
          - id: seat-32a
            title: 32A
            subtitle: Extra legroom
            description: |
              Economy Class

              Window
              Extra legroom

              SGD 65
            badges: [Window, Extra legroom]
            actions:
              - type: reply
                label: Select 32A
                set: { seat: 32A, seatUpgradePrice: 65 }
                next: extra_legroom_confirmation
      - type: suggested_replies
        sender: business
        options:
          - label: Keep current seat
            set: { seat: 24C }
            next: check_in_processing

  # --------------------------------------------------
  # EXTRA LEGROOM
  # --------------------------------------------------
  - id: extra_legroom_confirmation
    messages:
      - type: text
        sender: business
        text: |
          Seat 32A is an extra-legroom window seat.

          Additional charge: SGD {{seatUpgradePrice}}
      - type: suggested_replies
        sender: business
        options:
          - label: Confirm 32A
            next: seat_selected
          - label: Choose another
            next: seat_selection

  # --------------------------------------------------
  # SEAT CONFIRMATION
  # --------------------------------------------------
  - id: seat_selected
    messages:
      - type: text
        sender: business
        text: |
          {{seat}} selected ✓

          Your seat will be confirmed when check-in is completed.
      - type: suggested_replies
        sender: business
        options:
          - label: Complete check-in
            next: check_in_processing
          - label: Change seat
            next: seat_selection

  # --------------------------------------------------
  # PROCESS CHECK-IN
  # --------------------------------------------------
  - id: check_in_processing
    messages:
      - type: typing
        duration: 1200
      - type: text
        sender: business
        text: |
          Checking you in…
      - type: delay
        duration: 1200
    next: check_in_success

  # --------------------------------------------------
  # CHECK-IN SUCCESS
  # --------------------------------------------------
  - id: check_in_success
    set:
      checkedIn: true
    messages:
      - type: text
        sender: business
        text: |
          You're checked in, {{customerName}} ✓

          Your boarding pass for {{flightNumber}} is ready.
      - type: delay
        duration: 700
      - type: boarding_pass
        sender: business
        passengerName: "{{customerName}} {{lastName}}"
        frequentFlyerNumber: "{{krisFlyerNumber}}"
        frequentFlyerStatus: "{{krisFlyerStatus}}"
        airline: Singapore Airlines
        airlineLogo: "/assets/brand-logo.svg"
        flightNumber: "{{flightNumber}}"
        date: "{{departureDate}}"
        origin: { code: "{{originCode}}", city: "{{originCity}}" }
        destination: { code: "{{destinationCode}}", city: "{{destinationCity}}" }
        departureTime: "{{departureTime}}"
        boardingTime: "{{boardingTime}}"
        terminal: "{{terminal}}"
        gate: "{{gate}}"
        seat: "{{seat}}"
        boardingGroup: "Group 3"
        cabinClass: "{{cabin}}"
        bookingReference: "{{bookingReference}}"
        actions:
          - type: download
            label: Download boarding pass
            next: boarding_pass_downloaded
          - type: add_to_wallet
            label: Add to wallet
            next: wallet_added
          - type: reply
            label: Flight details
            next: checked_in_flight_details

  # --------------------------------------------------
  # DOWNLOAD
  # --------------------------------------------------
  - id: boarding_pass_downloaded
    messages:
      - type: system_action
        action: download
        title: Boarding pass downloaded
        description: "BoardingPass-{{flightNumber}}-{{customerName}}.pdf"
      - type: text
        sender: business
        text: |
          Your boarding pass has been saved to your device.
      - type: suggested_replies
        sender: business
        options:
          - label: Flight details
            next: checked_in_flight_details
          - label: Add to wallet
            next: wallet_added
          - label: Done
            next: final_message

  # --------------------------------------------------
  # WALLET
  # --------------------------------------------------
  - id: wallet_added
    messages:
      - type: system_action
        action: wallet
        title: Added to wallet
        description: "{{flightNumber}} · {{originCode}} → {{destinationCode}}"
      - type: text
        sender: business
        text: |
          Your boarding pass has been added to your wallet.
      - type: suggested_replies
        sender: business
        options:
          - label: Flight details
            next: checked_in_flight_details
          - label: Done
            next: final_message

  # --------------------------------------------------
  # CHECKED-IN FLIGHT DETAILS
  # --------------------------------------------------
  - id: checked_in_flight_details
    messages:
      - type: flight_card
        sender: business
        airline: Singapore Airlines
        flightNumber: "{{flightNumber}}"
        origin: { code: "{{originCode}}", city: "{{originCity}}" }
        destination: { code: "{{destinationCode}}", city: "{{destinationCity}}" }
        date: "{{departureDate}}"
        departureTime: "{{departureTime}}"
        arrivalTime: "{{arrivalTime}}"
        terminal: "{{terminal}}"
        gate: "{{gate}}"
        status: Checked in
      - type: suggested_replies
        sender: business
        options:
          - label: Boarding pass
            next: show_boarding_pass_again
          - label: Done
            next: final_message

  # --------------------------------------------------
  # BOARDING PASS AGAIN
  # --------------------------------------------------
  - id: show_boarding_pass_again
    messages:
      - type: boarding_pass
        sender: business
        passengerName: "{{customerName}} {{lastName}}"
        frequentFlyerNumber: "{{krisFlyerNumber}}"
        frequentFlyerStatus: "{{krisFlyerStatus}}"
        airline: Singapore Airlines
        airlineLogo: "/assets/brand-logo.svg"
        flightNumber: "{{flightNumber}}"
        date: "{{departureDate}}"
        origin: { code: "{{originCode}}", city: "{{originCity}}" }
        destination: { code: "{{destinationCode}}", city: "{{destinationCity}}" }
        departureTime: "{{departureTime}}"
        boardingTime: "{{boardingTime}}"
        terminal: "{{terminal}}"
        gate: "{{gate}}"
        seat: "{{seat}}"
        boardingGroup: "Group 3"
        cabinClass: "{{cabin}}"
        bookingReference: "{{bookingReference}}"
        actions:
          - type: download
            label: Download
          - type: add_to_wallet
            label: Add to wallet
          - type: reply
            label: Done
            next: final_message

  # --------------------------------------------------
  # END
  # --------------------------------------------------
  - id: final_message
    messages:
      - type: text
        sender: business
        text: |
          You're all set, {{customerName}}.

          We'll let you know here if there are any changes to your flight or gate.

          Have a pleasant flight to {{destinationCity}} ✈️
    end: true
