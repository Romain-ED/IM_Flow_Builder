# Business Messaging Flow Simulator — example scenario
# Fictional Beerlao account login (OTP) & event promotion journey.
version: "1.0"

metadata:
  id: beerlao-login-otp-event-promo
  name: "Beerlao Login OTP and Event Promotion"
  description: "Secure account login with OTP verification followed by a Beerlao event promotion."
  channel: whatsapp
  tags: [beerlao, authentication, otp, marketing, event, laos]

brand:
  name: "Beerlao"
  shortName: "Beerlao"
  avatar: "/assets/brand-avatar-beerlao.svg"
  verified: true

defaults:
  messageDelayMs: 500
  typingDurationMs: 800
  showTimestamps: true

variables:
  customerName: Alex
  otpCode: "1234"
  otpExpiry: "10 minutes"
  eventName: "Boun Souang Heua"
  eventLocation: "Vientiane"
  eventDate: "18 October 2026"
  promoCode: "RACEDAY15"
  productName: "Beerlao Gold Reserve"

start: otp_delivery

nodes:
  - id: otp_delivery
    messages:
      - type: text
        text: "Your Beerlao verification code is {{otpCode}}. Enter it below to log in to your account. It expires in {{otpExpiry}}. If you did not request this code, you can safely ignore this message."
    next: otp_entry

  - id: otp_entry
    messages:
      - type: otp
        prompt: "Enter the 4-digit code we sent you."
        codeLength: 4
        variable: enteredOtp
        next: otp_check

  # Pure routing node: evaluates the moment enteredOtp is set by otp_entry,
  # no messages of its own — same pattern as the README's condition example.
  - id: otp_check
    condition:
      variable: enteredOtp
      operator: equals
      value: "1234"
    then: login_confirmed
    else: otp_error

  - id: otp_error
    messages:
      - type: text
        text: "That code doesn't look right. Please check the code and try again."
    actions:
      - label: "Try again"
        next: otp_entry

  - id: login_confirmed
    messages:
      - type: text
        text: "You're logged in, {{customerName}}. Welcome back to Beerlao!"
    next: event_intro

  - id: event_intro
    messages:
      - type: text
        text: "🍺 Something special is coming to {{eventLocation}} for {{eventName}}."
    next: event_promotion

  - id: event_promotion
    messages:
      - type: rich_card
        image: "/assets/event-boun-souang-heua.svg"
        title: "Celebrate {{eventName}} with Beerlao"
        description: "The boats are racing and Beerlao is bringing something new. Discover {{productName}} during the celebrations on {{eventDate}} and enjoy 15% off your next order with code {{promoCode}}."
        actions:
          - type: open_url
            label: "Discover the new beer"
            url: "https://beerlao.la/"
          - type: reply
            label: "Event details"
            next: event_details
    actions:
      - label: "Maybe later"
        next: dismissed

  - id: event_details
    messages:
      - type: text
        text: "Join the {{eventName}} celebrations in {{eventLocation}} on {{eventDate}}. 🛶🍺 Try {{productName}} and use code {{promoCode}} for 15% off your next order."
      - type: suggested_actions
        actions:
          - type: open_url
            label: "Explore Beerlao"
            url: "https://beerlao.la/"
          - type: reply
            label: "Sounds good"
            next: interested
    actions:
      - label: "Not interested"
        next: dismissed

  - id: interested
    messages:
      - type: text
        text: "See you at the celebrations, {{customerName}}! 🍺 Remember your code: {{promoCode}}."
    end: true

  - id: dismissed
    messages:
      - type: text
        text: "No problem. Enjoy your day, {{customerName}}!"
    end: true
