# Business Messaging Flow Simulator — example scenario
# Fictional Beerlao account login (OTP) & event promotion journey.
version: "1.0"

metadata:
  id: beerlao-login-otp-event-promo
  name: "Beerlao Login OTP and Event Promotion"
  description: "Secure account login with OTP verification followed by a Beerlao event promotion."
  channel: whatsapp
  tags: [beerlao, authentication, otp, marketing, event, laos]

brand:
  name: "Beerlao"
  shortName: "Beerlao"
  avatar: "/assets/beerlao_logo.png"
  verified: true

defaults:
  messageDelayMs: 500
  typingDurationMs: 800
  showTimestamps: true

variables:
  customerName: Alex
  otpCode: "1234"
  otpExpiry: "10 minutes"
  eventName: "Boun Souang Heua"
  eventLocation: "Vientiane"
  eventDate: "10–20 October 2026"
  promoCode: "RACEDAY15"
  discount: "16%"
  productName: "Beerlao Gold or Dark"

start: otp_delivery

nodes:
  - id: otp_delivery
    messages:
      - type: text
        text: "Your Beerlao verification code is {{otpCode}}. Enter it below to log in to your account. It expires in {{otpExpiry}}. If you did not request this code, you can safely ignore this message."
    next: otp_entry

  # `input` (not `otp`) on purpose — WhatsApp has no real message that
  # renders 4 separate digit boxes with an embedded Verify button, so that
  # component always shows the "not officially supported" warning. `input`
  # is a real supported type: it renders as a plain text bubble and the
  # reply is typed into the ordinary composer, indistinguishable from a
  # real WhatsApp message — same validate/retry behavior, no warning.
  - id: otp_entry
    messages:
      - type: input
        inputType: numeric
        placeholder: "Enter the 4-digit code we sent you."
        submitLabel: "Verify"
        variable: enteredOtp
        next: otp_check

  # Pure routing node: evaluates the moment enteredOtp is set by otp_entry,
  # no messages of its own — same pattern as the README's condition example.
  - id: otp_check
    condition:
      variable: enteredOtp
      operator: equals
      value: "1234"
    then: login_confirmed
    else: otp_error

  - id: otp_error
    messages:
      - type: text
        text: "That code doesn't look right. Please check the code and try again."
    actions:
      - label: "Try again"
        next: otp_entry

  - id: login_confirmed
    messages:
      - type: text
        text: "You're logged in, {{customerName}}. Welcome back to Beerlao!"
    next: event_intro

  - id: event_intro
    messages:
      - type: text
        text: "🍺 The drums are beating, the boats are racing — and Beerlao is ready to celebrate with you! 🛶"
    next: event_promotion

  - id: event_promotion
    messages:
      - type: rich_card
        image: "/assets/event-boun-souang-heua-promo.jpg"
        title: "Celebrate {{eventName}} with Beerlao"
        description: "Enjoy {{discount}} OFF your next order of {{productName}}. Use code {{promoCode}}. Offer valid {{eventDate}} only. Don't miss the wave! 🌊"
        footer: "Drink responsibly. 18+."
        actions:
          - type: open_url
            label: "Order now"
            url: "https://beerlao.la/"
          - type: reply
            label: "Event details"
            next: event_details
    actions:
      - label: "Maybe later"
        next: dismissed

  - id: event_details
    messages:
      - type: text
        text: "Join the {{eventName}} boat racing celebrations in {{eventLocation}}! 🛶🍺 Enjoy {{discount}} off {{productName}} from {{eventDate}}. Use code {{promoCode}} at checkout."
      - type: suggested_actions
        actions:
          - type: open_url
            label: "Order Beerlao"
            url: "https://beerlao.la/"
          - type: reply
            label: "Sounds good"
            next: interested
    actions:
      - label: "Not interested"
        next: dismissed

  - id: interested
    messages:
      - type: text
        text: "See you at the races, {{customerName}}! 🍺🛶 Remember your code: {{promoCode}} for {{discount}} off."
    end: true

  - id: dismissed
    messages:
      - type: text
        text: "No problem. Enjoy your day, {{customerName}}!"
    end: true
