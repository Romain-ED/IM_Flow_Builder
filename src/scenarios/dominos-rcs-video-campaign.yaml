version: "1.0"
metadata:
  id: dominos-rcs-video-campaign
  name: "Domino's Video & Deals"
  description: "A personalized Domino's pizza-night promotion with video, deals, vouchers, and menu discovery."
  channel: rcs
  tags: [Domino's, promotion, video, carousel, vouchers, demo]
brand:
  name: "Domino's"
  shortName: "Domino's"
  description: "Pizza, offers and more"
  verified: true
defaults:
  messageDelayMs: 450
  typingDurationMs: 700
  showTimestamps: true
variables:
  customerName: Romain
  customerId: RM4821
  campaignId: pizza-night
  campaignVideo: /assets/dominos-rcs-video-campaign/gemini_generated_video_1c89463b.mp4
  heroImage: /assets/dominos-rcs-video-campaign/dominos-hero-pizza.jpg
  classicImage: /assets/dominos-rcs-video-campaign/dominos-classic-pizza.jpg
  veggieImage: /assets/dominos-rcs-video-campaign/dominos-veggie-pizza.jpg
  bundleImage: /assets/dominos-rcs-video-campaign/dominos-pizza-bundle.jpg
  menuImage: /assets/dominos-rcs-video-campaign/dominos-menu.jpg
  heroOffer: "2 pizzas from $19.99 + a free side"
  heroDescription: "Make tonight delicious, {{customerName}}. Enjoy two medium pizzas from $19.99 and choose a free side for your pizza night."
  selectedProduct: null
  selectedOrderUrl: "https://example.com/order?customerId=RM4821&campaignId=pizza-night&product=hero-offer&source=rcs"
  selectedVoucher: null
  marketingOptOut: false
  heroOrderUrl: "https://example.com/order?customerId=RM4821&campaignId=pizza-night&product=hero-offer&source=rcs"
  classicOrderUrl: "https://example.com/order?customerId=RM4821&campaignId=pizza-night&product=classic-pizza&source=rcs"
  veggieOrderUrl: "https://example.com/order?customerId=RM4821&campaignId=pizza-night&product=veggie-pizza&source=rcs"
  bundleOrderUrl: "https://example.com/order?customerId=RM4821&campaignId=pizza-night&product=sharing-bundle&source=rcs"
  menuUrl: "https://example.com/menu?customerId=RM4821&campaignId=pizza-night&category=full-menu&source=rcs"
  classicVoucher: DOMINO15
  veggieVoucher: VEGGIE20
  bundleVoucher: BUNDLE25
  classicRedeemUrl: "https://example.com/order?customerId=RM4821&campaignId=pizza-night&product=classic-pizza&voucher=DOMINO15&source=rcs"
  veggieRedeemUrl: "https://example.com/order?customerId=RM4821&campaignId=pizza-night&product=veggie-pizza&voucher=VEGGIE20&source=rcs"
  bundleRedeemUrl: "https://example.com/order?customerId=RM4821&campaignId=pizza-night&product=sharing-bundle&voucher=BUNDLE25&source=rcs"
triggers:
  - keywords: [STOP, unsubscribe]
    next: unsubscribed
start: campaign_gate
nodes:
  - id: campaign_gate
    condition:
      variable: marketingOptOut
      operator: equals
      value: true
    then: suppressed
    else: campaign_video

  - id: campaign_video
    messages:
      - type: video
        url: "{{campaignVideo}}"
        caption: "{{customerName}}, your pizza night starts here 🍕"
        durationLabel: "0:20"
      - type: text
        text: "Explore your personal Domino's offer below, {{customerName}}. Reply STOP at any time to stop promotional messages."
    next: hero_offer

  - id: hero_offer
    messages:
      - type: rich_card
        image: "{{heroImage}}"
        title: "{{customerName}}'s {{heroOffer}}"
        description: "{{heroDescription}}"
        actions:
          - type: reply
            label: "Order now"
            set:
              selectedProduct: "Pizza Night Deal"
              selectedOrderUrl: "{{heroOrderUrl}}"
            next: order_gate
          - type: reply
            label: "Browse more"
            next: browse_gate
      - type: text
        text: "Ready to make it a feast? You can also browse the full menu or opt out anytime."
      - type: suggested_replies
        options:
          - label: "Full menu"
            next: menu_gate
          - label: "Unsubscribe"
            next: unsubscribed

  - id: browse_gate
    condition:
      variable: marketingOptOut
      operator: equals
      value: true
    then: suppressed
    else: product_carousel

  - id: product_carousel
    messages:
      - type: text
        text: "Pick your favorite, {{customerName}} — every deal is ready to order."
      - type: carousel
        cards:
          - id: classic-pizza
            image: "{{classicImage}}"
            title: "Classic Pizza"
            subtitle: "From $9.99"
            description: "A crowd-pleasing classic with your choice of toppings."
            actions:
              - type: reply
                label: "Order"
                set:
                  selectedProduct: "Classic Pizza"
                  selectedOrderUrl: "{{classicOrderUrl}}"
                next: order_gate
              - type: reply
                label: "Get deal code"
                set:
                  selectedProduct: "Classic Pizza"
                  selectedVoucher: "{{classicVoucher}}"
                  selectedOrderUrl: "{{classicRedeemUrl}}"
                next: voucher_gate
          - id: veggie-pizza
            image: "{{veggieImage}}"
            title: "Veggie Pizza"
            subtitle: "From $10.99"
            description: "Fresh, colorful toppings for a seriously satisfying slice."
            actions:
              - type: reply
                label: "Order"
                set:
                  selectedProduct: "Veggie Pizza"
                  selectedOrderUrl: "{{veggieOrderUrl}}"
                next: order_gate
              - type: reply
                label: "Get deal code"
                set:
                  selectedProduct: "Veggie Pizza"
                  selectedVoucher: "{{veggieVoucher}}"
                  selectedOrderUrl: "{{veggieRedeemUrl}}"
                next: voucher_gate
          - id: sharing-bundle
            image: "{{bundleImage}}"
            title: "Sharing Bundle"
            subtitle: "From $24.99"
            description: "More pizza, more sides, and more reasons to share."
            actions:
              - type: reply
                label: "Order"
                set:
                  selectedProduct: "Sharing Bundle"
                  selectedOrderUrl: "{{bundleOrderUrl}}"
                next: order_gate
              - type: reply
                label: "Get deal code"
                set:
                  selectedProduct: "Sharing Bundle"
                  selectedVoucher: "{{bundleVoucher}}"
                  selectedOrderUrl: "{{bundleRedeemUrl}}"
                next: voucher_gate
      - type: text
        text: "Want to keep exploring? Choose the full menu, return to the featured offer, or reply STOP to opt out."
      - type: suggested_replies
        options:
          - label: "Full menu"
            next: menu_gate
          - label: "Back to offer"
            next: campaign_gate
          - label: "Unsubscribe"
            next: unsubscribed

  - id: order_gate
    condition:
      variable: marketingOptOut
      operator: equals
      value: true
    then: suppressed
    else: order_link

  - id: order_link
    messages:
      - type: text
        text: "Great choice, {{customerName}}! Your {{selectedProduct}} is ready when you are."
      - type: suggested_actions
        actions:
          - type: open_url
            label: "Continue to order"
            url: "{{selectedOrderUrl}}"
          - type: reply
            label: "Browse more"
            next: browse_gate
          - type: reply
            label: "Unsubscribe"
            next: unsubscribed
    end: true

  - id: voucher_gate
    condition:
      variable: marketingOptOut
      operator: equals
      value: true
    then: suppressed
    else: voucher_ready

  - id: voucher_ready
    messages:
      - type: text
        text: "Your personal deal is ready, {{customerName}}: use **{{selectedVoucher}}** for {{selectedProduct}}."
      - type: suggested_actions
        actions:
          - type: open_url
            label: "Redeem my deal"
            url: "{{selectedOrderUrl}}"
          - type: reply
            label: "Browse more"
            next: browse_gate
          - type: reply
            label: "Unsubscribe"
            next: unsubscribed
    end: true

  - id: menu_gate
    condition:
      variable: marketingOptOut
      operator: equals
      value: true
    then: suppressed
    else: full_menu

  - id: full_menu
    messages:
      - type: rich_card
        image: "{{menuImage}}"
        title: "The Domino's menu"
        description: "Build your perfect order with pizzas, sides, desserts, and tonight's featured deals."
        actions:
          - type: open_url
            label: "Open menu"
            url: "{{menuUrl}}"
          - type: reply
            label: "Featured deals"
            next: browse_gate
          - type: reply
            label: "Unsubscribe"
            next: unsubscribed
    end: true

  - id: unsubscribed
    set:
      marketingOptOut: true
    messages:
      - type: text
        text: "You're all set, {{customerName}}. Domino's promotional messages have stopped."
        showTyping: false
        typingMs: 0
        delayMs: 0
    end: true

  - id: suppressed
    end: true
