triggers:
  - keywords: [hi, hello, start, menu]
    next: welcome
  - keywords: [deals, promo, offer, discount]
    next: promotions
  - keywords: [order, pizza, buy]
    next: choose_crust
  - keywords: [store, location, near, find]
    next: location_request
  - keywords: [track, where, "delivery status"]
    next: track_order
  - keywords: [help, problem, complaint, refund]
    next: customer_care
  - keywords: [nps, survey]
    next: survey_delivery

start: promotions

nodes:
  - id: welcome
    label: "Welcome"
    messages:
      - type: rich_card
        image: "{{heroImage}}"
        mediaHeight: short
        title: "Welcome to Domino's Singapore! 🍕"
        description: "Hi {{customerName}}! 👋 Craving something delicious? You're in the right place. Order your favourite pizza, grab today's best deals, or find a store near you — all right here."
        actions:
          - type: reply
            label: "🔥 Today's Deals"
            next: promotions
          - type: reply
            label: "🍕 View Menu"
            next: menu_categories
          - type: reply
            label: "🛒 Order Now"
            next: choose_crust
          - type: reply
            label: "📍 Find a Store"
            next: location_request

  - id: promotions
    label: "Promotions Carousel"
    messages:
      - type: carousel
        delayMs: 0
        typingMs: 0
        showTyping: false
        cards:
          - id: promo-everyday-regular
            image: "{{promoEverydayRegularImage}}"
            title: "Everyday Value — 1 Regular Pizza"
            subtitle: "$5.99"
            description: "1 Regular Pizza for just $5.99! Choose from our classic range. Perfect for a solo meal. 🍕"
            actions:
              - type: reply
                label: "Order for $5.99"
                set:
                  selectedDeal: everyday_regular
                  selectedPizza: "Everyday Value Pizza"
                  selectedSize: regular
                  selectedQuantity: 1
                  promoCode: "Everyday Value $5.99"
                next: choose_crust
              - type: reply
                label: "See All Deals"
                next: promotions
          - id: promo-everyday-large
            image: "{{promoEverydayLargeImage}}"
            title: "$9.99 — Everyday Value: 1 Large Pizza"
            description: "1 Large Pizza for just $9.99! More slices, more smiles. 😄"
            actions:
              - type: reply
                label: "Order for $9.99"
                set:
                  selectedDeal: everyday_large
                  selectedPizza: "Everyday Value Pizza"
                  selectedSize: large
                  selectedQuantity: 1
                  promoCode: "Everyday Value $9.99"
                next: choose_crust
              - type: reply
                label: "See All Deals"
                next: promotions
          - id: promo-50off-1-regular
            image: "{{promo50Off1RegularImage}}"
            title: "50% Off 1 Regular Pizza"
            subtitle: "From $12.95"
            description: "Get 50% off when you order 2 Regular Pizzas — from only $12.95! Mix and match any flavours. 🎉"
            actions:
              - type: reply
                label: "Grab This Deal"
                set:
                  selectedDeal: 50off_1regular
                  selectedPizza: "Choose 2 Regular Pizzas"
                  selectedSize: regular
                  selectedQuantity: 2
                  promoCode: "50% Off Regular"
                next: choose_crust
              - type: reply
                label: "See All Deals"
                next: promotions
          - id: promo-50off-2-regular
            image: "{{promo50Off2RegularImage}}"
            title: "50% Off 2 Regular Pizzas"
            subtitle: "From $25.90"
            description: "Two's better than one! Get 50% off 2 Regular Pizzas from just $25.90. Perfect for sharing! 🍕🍕"
            actions:
              - type: reply
                label: "Order 2 for $25.90"
                set:
                  selectedDeal: 50off_2regular
                  selectedPizza: "Choose 2 Regular Pizzas"
                  selectedSize: regular
                  selectedQuantity: 2
                  promoCode: "50% Off 2 Regular"
                next: choose_crust
              - type: reply
                label: "See All Deals"
                next: promotions
          - id: promo-50off-2-large
            image: "{{promo50Off2LargeImage}}"
            title: "50% Off 2 Large Pizzas"
            subtitle: "From $33.90"
            description: "Go big! 50% off 2 Large Pizzas — from $33.90 only. Feed the whole family tonight! 🍕🍕"
            actions:
              - type: reply
                label: "Order 2 Larges"
                set:
                  selectedDeal: 50off_2large
                  selectedPizza: "Choose 2 Large Pizzas"
                  selectedSize: large
                  selectedQuantity: 2
                  promoCode: "50% Off 2 Large"
                next: choose_crust
              - type: reply
                label: "See All Deals"
                next: promotions
          - id: promo-3-pizza-3-sides
            image: "{{promo3Pizza3SidesImage}}"
            title: "3 Pizzas + 3 Sides (Cheese & Steak)"
            subtitle: "Group meal"
            description: "The perfect group meal! 3 pizzas featuring our Cheese & Steak range plus 3 sides including Coca-Cola. Best value for groups!"
            actions:
              - type: reply
                label: "Order This Bundle"
                set:
                  selectedDeal: 3pizza_3sides_bundle
                  selectedPizza: "3 Pizza Cheese & Steak Bundle"
                  selectedSize: large
                  selectedQuantity: 3
                  selectedSide: "3 included sides"
                  promoCode: "Group bundle"
                next: cart_review
              - type: reply
                label: "See All Deals"
                next: promotions
          - id: promo-4-pizza-3-sides
            image: "{{promo4Pizza3SidesImage}}"
            title: "4 Pizzas + 3 Sides (Cheese & Steak)"
            subtitle: "Family feast"
            description: "The ultimate feast! 4 pizzas from our Cheese & Steak range plus 3 sides. Perfect for parties and family nights! 🎉"
            actions:
              - type: reply
                label: "Order This Bundle"
                set:
                  selectedDeal: 4pizza_3sides_bundle
                  selectedPizza: "4 Pizza Cheese & Steak Bundle"
                  selectedSize: large
                  selectedQuantity: 4
                  selectedSide: "3 included sides"
                  promoCode: "Family bundle"
                next: cart_review
              - type: reply
                label: "See All Deals"
                next: promotions
          - id: promo-cheese-volcano
            image: "{{promoCheeseVolcanoImage}}"
            title: "🌋 2 Cheese Volcano + 6 Sides"
            subtitle: "Limited time"
            description: "The ultimate feast! 2 Cheese Volcano Pizzas with molten cheese at the centre, plus 6 sides including Garlic Bread and Coca-Cola. Limited time!"
            actions:
              - type: reply
                label: "Order This Bundle"
                set:
                  selectedDeal: cheese_volcano_bundle
                  selectedPizza: "2 Cheese Volcano Pizzas"
                  selectedSize: large
                  selectedQuantity: 2
                  selectedSide: "6 included sides"
                  promoCode: "Cheese Volcano bundle"
                next: cart_review
              - type: reply
                label: "See All Deals"
                next: promotions
          - id: promo-pizza-puff
            image: "{{promoPizzaPuffImage}}"
            title: "🆕 NEW Pizza Puff + Drumlets"
            subtitle: "New product"
            description: "Introducing our NEW Pizza Puff — a crispy golden pastry filled with gooey cheese and sausage, served with Chicken Drumlets and creamy dip. Try it today!"
            actions:
              - type: reply
                label: "Try It Now"
                set:
                  selectedDeal: pizza_puff_combo
                  selectedPizza: "Pizza Puff + Drumlets"
                  selectedSize: null
                  selectedQuantity: 1
                  selectedSide: "Chicken Drumlets + creamy dip"
                  promoCode: "Pizza Puff combo"
                next: cart_review
              - type: reply
                label: "Back to Menu"
                next: menu_categories
      - type: suggested_replies
        delayMs: 0
        typingMs: 0
        showTyping: false
        options:
          - label: "🏠 Main Menu"
            next: post_promo_nav

  - id: post_promo_nav
    label: "Post-Promo Navigation"
    messages:
      - type: text
        text: "Ready to order, or want to browse more? 😊"
      - type: suggested_replies
        options:
          - label: "🛒 Order Now"
            next: choose_crust
          - label: "🍕 Full Menu"
            next: menu_categories
          - label: "📍 Find a Store"
            next: location_request
          - label: "🏠 Main Menu"
            next: welcome

  - id: menu_categories
    label: "Menu Categories Carousel"
    messages:
      - type: text
        text: "🍕 What are you in the mood for today? Browse our full menu below!"
      - type: carousel
        cards:
          - id: menu-pizzas
            image: "{{menuPizzasImage}}"
            title: "🍕 Pizzas"
            description: "Classic, specialty, and signature — over 15 flavours to choose from. Regular or Large, any crust!"
            actions:
              - type: reply
                label: "See All Pizzas"
                next: pizza_menu
              - type: reply
                label: "🛒 Order a Pizza"
                next: choose_crust
          - id: menu-sides
            image: "{{menuSidesImage}}"
            title: "🍗 Sides & Snacks"
            description: "Complete your meal with crispy sides — Chicken Drumlets, Garlic Bread, Crinkle Fries, and more!"
            actions:
              - type: reply
                label: "View Sides"
                next: sides_menu
              - type: reply
                label: "🛒 Add to Order"
                next: choose_crust
          - id: menu-drinks
            image: "{{menuDrinksImage}}"
            title: "🥤 Drinks"
            description: "Stay refreshed! Choose from Coca-Cola, Sprite, and more. Perfect to pair with your pizza."
            actions:
              - type: reply
                label: "View Drinks"
                next: drinks_menu
              - type: reply
                label: "🛒 Add to Order"
                next: choose_crust
          - id: menu-desserts
            image: "{{menuDessertsImage}}"
            title: "🍫 Desserts"
            description: "End on a sweet note! Try our legendary Chocolate Lava Cake — warm, gooey, and irresistible. 🤤"
            actions:
              - type: reply
                label: "View Desserts"
                next: desserts_menu
              - type: reply
                label: "🛒 Add to Order"
                next: choose_crust

