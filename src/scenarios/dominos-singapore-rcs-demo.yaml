  name: "Domino's Pizza Singapore — RCS Demo Flow"
  description: "End-to-end RCS demo covering promotions, menu browsing, order building, store discovery, tracking, customer care, and checkout handoff."
  channel: rcs
  tags: [Domino's, Singapore, promotions, menu, ordering, stores, tracking, customer-care]
brand:
