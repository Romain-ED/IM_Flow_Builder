  description: "Romain demo"
  verified: true
  website: "https://www.vonage.com"
  supportPhone: "9750 2284"
  email: "romain.edin@vonage.com"
  rcsProfile:
    displayName: "Romain RCS Demo Agent"
    subtitle: "Romain demo"
    brandLabel: "Vonage"
    phone: "9750 2284"
    websiteLabel: "www.vonage.com"
    websiteUrl: "https://www.vonage.com"
    email: "romain.edin@vonage.com"
    imageCount: 44
