  # ── NPS / satisfaction survey ─────────────────────────────────────────
  # Triggered by typing "NPS" (global trigger above). Demo of a delivered
  # order with hardcoded items; ratings are stored in npsXxx variables.
  - id: survey_delivery
    label: "NPS Survey — Delivery"
    messages:
      - type: text
        text: "⭐ Let's rate your last order, {{customerName}}! It only takes a minute. 🙏"
      - type: text
        text: "🛵 Question 1 of 4\nHow was your delivery?\n\nTap a star rating (1 = poor, 5 = great) 👇"
      - type: suggested_replies
        options:
          - label: "⭐"
            set: { npsDelivery: 1 }
            next: survey_item_pizza
          - label: "⭐⭐"
            set: { npsDelivery: 2 }
            next: survey_item_pizza
          - label: "⭐⭐⭐"
            set: { npsDelivery: 3 }
            next: survey_item_pizza
          - label: "⭐⭐⭐⭐"
            set: { npsDelivery: 4 }
            next: survey_item_pizza
          - label: "⭐⭐⭐⭐⭐"
            set: { npsDelivery: 5 }
            next: survey_item_pizza

  - id: survey_item_pizza
    label: "NPS Survey — Pepperoni Pizza"
    messages:
      - type: text
        text: "🍕 Question 2 of 4\nHow was your Pepperoni Pizza (Large)?\n\nTap a star rating (1 = poor, 5 = great) 👇"
      - type: suggested_replies
        options:
          - label: "⭐"
            set: { npsPizza: 1 }
            next: survey_item_drumlets
          - label: "⭐⭐"
            set: { npsPizza: 2 }
            next: survey_item_drumlets
          - label: "⭐⭐⭐"
            set: { npsPizza: 3 }
            next: survey_item_drumlets
          - label: "⭐⭐⭐⭐"
            set: { npsPizza: 4 }
            next: survey_item_drumlets
          - label: "⭐⭐⭐⭐⭐"
            set: { npsPizza: 5 }
            next: survey_item_drumlets

  - id: survey_item_drumlets
    label: "NPS Survey — Chicken Drumlets"
    messages:
      - type: text
        text: "🍗 Question 3 of 4\nHow were your Chicken Drumlets (6 pcs)?\n\nTap a star rating (1 = poor, 5 = great) 👇"
      - type: suggested_replies
        options:
          - label: "⭐"
            set: { npsDrumlets: 1 }
            next: survey_comment
          - label: "⭐⭐"
            set: { npsDrumlets: 2 }
            next: survey_comment
          - label: "⭐⭐⭐"
            set: { npsDrumlets: 3 }
            next: survey_comment
          - label: "⭐⭐⭐⭐"
            set: { npsDrumlets: 4 }
            next: survey_comment
          - label: "⭐⭐⭐⭐⭐"
            set: { npsDrumlets: 5 }
            next: survey_comment

  - id: survey_comment
    label: "NPS Survey — What Could We Improve"
    freeTextNext: survey_recap
    messages:
      - type: text
        text: "💬 Question 4 of 4\nWhat could we improve? Type your feedback below, or pick a quick option 👇"
      - type: suggested_replies
        options:
          - label: "🛵 Faster delivery"
            next: survey_recap
          - label: "🍕 Food quality"
            next: survey_recap
          - label: "💰 Better prices"
            next: survey_recap
          - label: "📞 Customer service"
            next: survey_recap
          - label: "👍 Nothing, all good!"
            next: survey_recap
          - label: "⏭️ Skip"
            next: survey_recap

  - id: survey_recap
    label: "NPS Survey — Recap"
    messages:
      - type: text
        text: "🙏 Here's your feedback:\n\n🛵 Delivery: {{npsDelivery}}/5 ⭐\n🍕 Pepperoni Pizza (Large): {{npsPizza}}/5 ⭐\n🍗 Chicken Drumlets (6 pcs): {{npsDrumlets}}/5 ⭐\n💬 Comment: {{npsComment}}\n\nThanks for your feedback, we'll take it into account 🙏\nSee you at the next pizza night! 🍕"
      - type: suggested_replies
        options:
          - label: "🏠 Main Menu"
            next: welcome
          - label: "🔥 Today's Deals"
            next: promotions
