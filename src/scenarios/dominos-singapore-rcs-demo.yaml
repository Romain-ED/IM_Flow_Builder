  - id: cart_review
    label: "Cart Review"
    messages:
      - type: rich_card
        image: "{{cartReviewImage}}"
        mediaHeight: tall
        title: "🛒 Your Order Summary"
        description: "🍕 {{selectedQuantity}}x {{selectedPizza}} ({{selectedSize}}, {{selectedCrust}})\n🍗 Side: {{selectedSide}}\n🥤 Drink: {{selectedDrink}}\n🍫 Dessert: {{selectedDessert}}\n\n🏷️ Promotion: {{promoCode}}\n\nSubtotal: {{subtotal}}\nDelivery: {{deliveryFee}}\nTOTAL: {{total}}\n\nThe final total and any applicable discount will be confirmed at checkout."
      - type: text
        text: "Review your order and choose what to do next:"
      - type: suggested_replies
        options:
          - label: "✅ Checkout"
            next: order_confirmation
          - label: "➕ Add More Items"
            next: menu_categories
          - label: "🗑 Clear Cart"
            set:
              selectedDeal: null
              selectedPizza: "Not selected"
              selectedSize: null
              selectedQuantity: 1
              selectedCrust: "Not selected"
              selectedCrustSurcharge: 0
              selectedSide: "None selected"
              selectedDrink: "None selected"
              selectedDessert: "None selected"
              selectedStoreName: "Not selected"
              selectedStoreId: null
