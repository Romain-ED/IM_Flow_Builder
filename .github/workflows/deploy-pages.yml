name: Deploy to GitHub Pages

on:
  push:
    # The repo's GitHub Pages environment only allows deployments from the
    # repository's actual default branch — not "main" (this repo's default
    # branch is still the original feature branch it was created on). Both
    # branches are always kept in sync (main is fast-forwarded to match
    # after every push), so triggering here is equivalent.
    branches: [claude/messaging-flow-simulator-wboec4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
